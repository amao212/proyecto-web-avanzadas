{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<section class="card shadow-sm mx-auto form-estrecha" aria-labelledby="titulo">
  <div class="card-body p-4">
    <h1 id="titulo" class="h3 mb-3">Recuperar contraseña</h1>
    <form method="post" novalidate>
      {{ form.hidden_tag() }}{{ campo(form.email) }}
      <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
    </form>
    <p class="mt-3 mb-0"><a href="{{ url_for('auth.signin') }}">Volver</a></p>
  </div>
</section>
{% endblock %}
