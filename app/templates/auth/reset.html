{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<section class="card shadow-sm mx-auto form-estrecha" aria-labelledby="titulo">
  <div class="card-body p-4">
    <h1 id="titulo" class="h3 mb-3">Nueva contraseña</h1>
    <form method="post" novalidate>
      {{ form.hidden_tag() }}{{ campo(form.password) }}{{ campo(form.confirmar) }}
      <button class="btn btn-primary w-100" type="submit">Guardar</button>
    </form>
  </div>
</section>
{% endblock %}
