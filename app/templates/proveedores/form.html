{% extends "base.html" %}{% from "_macros.html" import campo %}{% block title %}Nuevo proveedor{% endblock %}
{% block content %}
<section class="card shadow-sm mx-auto form-estrecha" aria-labelledby="titulo">
  <div class="card-body p-4">
    <h1 id="titulo" class="h3 mb-3">Nuevo proveedor</h1>
    <form method="post" novalidate>
      {{ form.hidden_tag() }}{{ campo(form.nombre) }}{{ campo(form.ruc) }}{{ campo(form.telefono) }}
      <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('main.proveedores') }}">Cancelar</a></div>
    </form>
  </div>
</section>
{% endblock %}
